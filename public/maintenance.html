<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maintenance — The Titus Global</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --purple-950: #240046;
        --purple-900: #3c096c;
        --orange-500: #ff8500;
        --text: #f8f4ff;
        --muted: rgba(255, 255, 255, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text);
        background: linear-gradient(145deg, var(--purple-950) 0%, var(--purple-900) 55%, #1a0530 100%);
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem 1.75rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
      }
      .logo {
        display: block;
        height: 3.5rem;
        width: auto;
        max-width: 200px;
        margin: 0 auto 1.5rem;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 1.75rem);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      .contact {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1rem;
        font-weight: 700;
        font-size: 0.875rem;
        color: var(--purple-950);
        background: linear-gradient(135deg, #ff6d00, #ff9e00);
        border-radius: 8px;
        text-decoration: none;
      }
      a.secondary {
        color: var(--text);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/images/logo.png" alt="The Titus Global" width="200" height="56" />
      <h1>We&rsquo;ll be back soon</h1>
      <p>
        Our website is being updated. Admissions is still available by phone or WhatsApp.
      </p>
      <div class="contact">
        <a href="tel:+919500096930">Call +91 95000 96930</a>
        <a class="secondary" href="https://wa.me/919500096930">Message on WhatsApp</a>
      </div>
    </main>
  </body>
</html>
